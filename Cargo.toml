[workspace]
resolver = "3"
members = [
    "crates/ttyamat",
    "crates/ttyamat-ui",
    "crates/ttyamat-terminal",
    "crates/ttyamat-config",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
iced = { version = "0.14.0", features = ["advanced"] }
thiserror = "2.0.20"
